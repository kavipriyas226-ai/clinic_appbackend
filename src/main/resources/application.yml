spring:
  application:
    name: devs-clinic-backend
  profiles:
    active: local
  data:
    mongodb:
      uri: ${MONGODB_URI:}

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:devsClinicDevSecretKeyChangeInProduction1234567890devsClinicDevSecretKey}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5175,https://clinic-app-nine-smoky.vercel.app}

logging:
  level:
    com.devsclinic.backend: INFO
